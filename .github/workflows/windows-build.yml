name: Windows Build

permissions:
  contents: write

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Compile check
        run: python -m compileall app main.py tools
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Waky and installer
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Waky-Setup
          path: dist/installer/*.exe
      - name: Attach installer to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $setup = Get-ChildItem dist/installer/Waky-Setup-*.exe | Select-Object -First 1
          Copy-Item $setup.FullName Waky-Setup.exe
          $hash = (Get-FileHash Waky-Setup.exe -Algorithm SHA256).Hash.ToLower()
          gh release upload $env:TAG Waky-Setup.exe --clobber
          $body = gh release view $env:TAG --json body -q .body
          gh release edit $env:TAG --notes "$body`n`nSHA-256 of Waky-Setup.exe: $hash"
